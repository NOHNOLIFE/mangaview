<button type="button" id="layoutBtn" class="icon-btn tool-btn"></button>
<div id="filterPanel" class="filter-panel" hidden>
<div class="fp-row"><div class="range"><input id="min" type="number" min="0" data-placeholder="min"><span>–</span><input id="max" type="number" min="0" data-placeholder="max"></div><button type="button" id="markedToggle" class="icon-btn tool-btn toggle" aria-pressed="false" data-label="hasBookmarks"><svg class="i" aria-hidden="true"><use href="#i-bookmark"/></svg></button><div id="kindFilter" class="kind-filter" role="group" data-aria="fileTypes"><button type="button" class="icon-btn tool-btn toggle" data-kind="image" aria-pressed="false" data-label="kindImage"><svg class="i" aria-hidden="true"><use href="#i-photo"/></svg></button><button type="button" class="icon-btn tool-btn toggle" data-kind="video" aria-pressed="false" data-label="kindVideo"><svg class="i" aria-hidden="true"><use href="#i-film"/></svg></button><button type="button" class="icon-btn tool-btn toggle" data-kind="audio" aria-pressed="false" data-label="kindAudio"><svg class="i" aria-hidden="true"><use href="#i-music"/></svg></button></div></div>
<div id="tagSection" class="fp-tags"><label class="tag-search"><svg class="i" aria-hidden="true"><use href="#i-tag"/></svg><input id="tagQuery" type="search" data-placeholder="findTag" autocomplete="off"></label><div id="tagBar" class="tag-bar collapsed"></div><button type="button" id="tagMore" class="link-btn" hidden></button></div>
</div>
<div id="filterSummary" class="filter-summary" hidden></div>
<div id="expiredHint" class="shelf-note" hidden><p class="hint" data-t="expiredHint"></p><button type="button" id="restoreAllBtn"><svg class="i" aria-hidden="true"><use href="#i-link"/></svg><span data-t="restoreAll"></span></button></div>
<p id="storageWarn" class="shelf-note warn" hidden></p>
</form>
<div id="bulkPop" class="menu-pop" popover><div id="bulkActions" class="bulk-actions"></div></div>
<div id="presetPop" class="menu-pop preset-pop" popover></div>
<div id="sortPop" class="menu-pop sort-pop" popover role="menu" data-aria="shelfSort"></div>
<div id="cardMenu" class="menu-pop card-menu" popover role="menu"></div>
<div id="books"></div>
</dialog>

<dialog id="tagEditor" aria-labelledby="tagTitle">
<header><h2 id="tagTitle" data-t="editTags"></h2><button class="icon-btn" data-close data-label="close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></header>
<p id="tagBook" class="tag-book"></p>
<div id="tagList" class="tag-list"></div>
<form id="tagForm" class="tag-form"><input id="tagInput" data-placeholder="addTag" autocomplete="off" maxlength="40" role="combobox" aria-autocomplete="list" aria-controls="tagSuggest" aria-expanded="false"><button class="primary" type="submit" data-t="add"></button><div id="tagSuggest" class="tag-suggest" role="listbox" data-aria="editTags" hidden></div></form>
</dialog>

<dialog id="renameBook" aria-labelledby="renameTitle">
<header><h2 id="renameTitle" data-t="rename"></h2><button class="icon-btn" data-close data-label="close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></header>
<form id="renameForm" class="tag-form"><input id="renameInput" autocomplete="off" maxlength="200" data-placeholder="renameHolder"><button class="primary" type="submit" data-t="renameSave"></button></form>
<p id="renameHint" class="tag-book"></p>
</dialog>

<dialog id="addDialog" aria-labelledby="addTitle">
<header><h2 id="addTitle"></h2><button class="icon-btn" data-close data-label="close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></header>
<p id="addHint" class="hint"></p>
<div class="add-box"><ul id="addList" class="add-list"></ul><p id="addEmpty" class="add-empty" hidden></p></div>
<div class="add-more"><button type="button" id="addFolder"><svg class="i" aria-hidden="true"><use href="#i-folder-plus"/></svg><span></span></button><button type="button" id="addFiles"><svg class="i" aria-hidden="true"><use href="#i-file-plus"/></svg><span></span></button></div>
<footer><button type="button" id="addOne"></button><button type="button" id="addMany" class="primary"></button><button type="button" id="addLoose" class="primary" data-t="files" hidden></button></footer>
</dialog>

<dialog id="restore" aria-labelledby="restoreTitle">
<header><h2 id="restoreTitle"></h2><button class="icon-btn" data-close data-label="close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></header>
<p id="restoreHint" class="hint"></p>
<div id="restoreList" class="restore-list"></div>
<footer><span class="spacer"></span><button data-close data-t="cancel"></button><button id="restoreGo" class="primary"></button></footer>
</dialog>

<dialog id="sortOptions" aria-labelledby="sortTitle">
<header><h2 id="sortTitle" data-t="sort"></h2><button class="icon-btn" data-close data-label="close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></header>
<select id="sortScope" data-label="sortScope" hidden><option value="folder" data-t="folderSort"></option><option value="global" data-t="globalSort"></option></select>
<div class="segmented" role="group" data-aria="sortScope"><button type="button" data-scope="folder" data-t="folderSort"></button><button type="button" data-scope="global" data-t="globalSort"></button></div>
<div class="options">
<button data-mode="default"><svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg><span class="label"><span data-t="followSort"></span><small id="defaultSortName"></small></span><svg class="i check" aria-hidden="true"><use href="#i-check"/></svg></button>
<button data-mode="nameAsc"><svg class="i" aria-hidden="true"><use href="#i-name-asc"/></svg><span class="label" data-t="nameAsc"></span><svg class="i check" aria-hidden="true"><use href="#i-check"/></svg></button>
<button data-mode="nameDesc"><svg class="i" aria-hidden="true"><use href="#i-name-desc"/></svg><span class="label" data-t="nameDesc"></span><svg class="i check" aria-hidden="true"><use href="#i-check"/></svg></button>
<button data-mode="timeAsc"><svg class="i" aria-hidden="true"><use href="#i-clock"/></svg><span class="label" data-t="timeAsc"></span><svg class="i check" aria-hidden="true"><use href="#i-check"/></svg></button>
<button data-mode="timeDesc"><svg class="i" aria-hidden="true"><use href="#i-history"/></svg><span class="label" data-t="timeDesc"></span><svg class="i check" aria-hidden="true"><use href="#i-check"/></svg></button>
<button data-mode="shuffle"><svg class="i" aria-hidden="true"><use href="#i-shuffle"/></svg><span class="label" data-t="shuffle"></span><svg class="i check" aria-hidden="true"><use href="#i-check"/></svg></button>
</div>
</dialog>

<dialog id="help" aria-labelledby="helpTitle">
<header><h2 id="helpTitle" data-t="help"></h2><button class="icon-btn" data-close data-label="close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></header>
<div id="helpBody"></div>
</dialog>

<div id="dropOverlay" popover="manual" hidden><div class="box"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg><span id="dropText" data-t="dropHere"></span></div><div class="zones"><div id="dropMerge" class="zone" data-zone="merge"><svg class="i" aria-hidden="true"><use href="#i-merge"/></svg><span><strong data-t="dropMerge"></strong><small data-t="dropMergeHint"></small></span></div><div id="dropLoose" class="zone" data-zone="loose"><svg class="i" aria-hidden="true"><use href="#i-image-plus"/></svg><span><strong data-t="dropLoose"></strong><small data-t="dropLooseHint"></small></span></div></div></div>
<p id="notice" role="status" aria-live="polite"></p>
<input id="folderInput" type="file" webkitdirectory multiple hidden><input id="fileInput" type="file" accept="image/*,video/*,audio/*,.pbf,.srt,.vtt,.ass,.ssa,.lrc" multiple hidden>
</body>
</html>
